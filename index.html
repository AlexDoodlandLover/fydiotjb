<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fydiot WebExploit</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #e5e5e5;
    margin:0;
    padding:0;
  }
  #screen {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #fdfdfd;
    min-height: 100vh;
    box-shadow: 0 0 10px #999;
    position: relative;
  }
  .center {
    text-align: center;
  }
  .button {
    background: #007aff;
    color: white;
    padding: 10px 20px;
    margin: 10px;
    display: inline-block;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
  }
  #log {
    font-family: monospace;
    background: #000;
    color: #0f0;
    padding: 10px;
    height: 200px;
    overflow-y: scroll;
    margin: 10px;
  }
  #loader {
    display:none;
  }
  #fydiotApp {
    display:none;
    padding:10px;
  }
  .tab {
    padding: 10px;
    display:inline-block;
    background:#ddd;
    margin:2px;
    cursor:pointer;
    border-radius:5px;
  }
  .activeTab {
    background:#bbb;
    font-weight:bold;
  }
  #repository {
    display:none;
    margin-top:10px;
  }
  #appsList div {
    padding:5px;
    border:1px solid #ccc;
    margin:5px 0;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="screen">
  <div id="welcome" class="center">
    <h1>Fydiot Simulated Jailbreak</h1>
    <p id="osCheck"></p>
    <div id="startBtn" class="button">Start Jailbreak</div>
  </div>

  <div id="loader">
    <h2 class="center">Initializing...</h2>
    <div id="log"></div>
  </div>

  <div id="fydiotApp">
    <h2 class="center">Fydiot Loader</h2>
    <div>
      <span class="tab activeTab" onclick="switchTab('create')">Create App</span>
      <span class="tab" onclick="switchTab('discover')">Discover Apps</span>
    </div>
    <div id="create">
      <h3>Block Coding Editor</h3>
      <textarea id="code" rows="10" style="width:100%;"></textarea>
      <div class="button" onclick="runApp()">Run App</div>
    </div>
    <div id="discover">
      <h3>Public Repository</h3>
      <div id="appsList"></div>
    </div>
  </div>
</div>

<script>
// OS Detection
var ua = navigator.userAgent;
var isOldIOS = /iPhone|iPad|iPod/.test(ua) && /OS [3-6](_\d+)?/.test(ua);
var isOldAndroid = /Android [1-5]\./.test(ua);
var supported = isOldIOS || isOldAndroid;

document.getElementById('osCheck').innerText = supported ? 
  'Your device is supported. Click Start Jailbreak.' :
  'Sorry, this device is not supported. Please use iOS 3-6 or Android 1-5.';

// Fake Jailbreak
document.getElementById('startBtn').onclick = function(){
  if(!supported) return;
  document.getElementById('welcome').style.display='none';
  document.getElementById('loader').style.display='block';
  var log = document.getElementById('log');
  var steps = [
    "Scanning device...",
    "Bypassing security protocols...",
    "Injecting virtual payload...",
    "Overwriting system files...",
    "Optimizing kernel...",
    "Finalizing jailbreak..."
  ];
  var i=0;
  var interval = setInterval(function(){
    if(i<steps.length){
      log.innerHTML += steps[i] + "<br>";
      log.scrollTop = log.scrollHeight;
      i++;
    } else {
      clearInterval(interval);
      log.innerHTML += "<b>Jailbreak Complete! Save to Home Screen to load Fydiot.</b>";
    }
  },1500);
};

// App Tabs
function switchTab(tab){
  document.getElementById('create').style.display='none';
  document.getElementById('discover').style.display='none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('activeTab'));
  document.querySelector('.tab[onclick="switchTab(\''+tab+'\')"]').classList.add('activeTab');
  document.getElementById(tab).style.display='block';
}

// Simple app repository
var publicApps = [
  {name:"Bounce Ball", code:"alert('Bouncing Ball!')"},
  {name:"Click Counter", code:"var c=0; setInterval(()=>{c++; console.log(c);},1000)"}
];

function refreshApps(){
  var container = document.getElementById('appsList');
  container.innerHTML="";
  publicApps.forEach((app,i)=>{
    var div = document.createElement('div');
    div.innerText = app.name;
    div.onclick = function(){
      eval(app.code);
    }
    container.appendChild(div);
  });
}

refreshApps();

// Run custom app
function runApp(){
  var code = document.getElementById('code').value;
  try{
    eval(code);
    alert('App running!');
  } catch(e){
    alert('Error in app: '+e);
  }
}

// Detect if saved to home screen
function isInStandaloneMode() {
  return (window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
}

if(isInStandaloneMode()){
  document.getElementById('loader').style.display='none';
  document.getElementById('welcome').style.display='none';
  document.getElementById('fydiotApp').style.display='block';
}

</script>
</body>
</html>
