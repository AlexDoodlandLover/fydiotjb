<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fydiot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
body {margin:0; font-family:Helvetica, Arial, sans-serif; background:#e5e5e5;}
#screen {width:95%; max-width:480px; margin:0 auto; min-height:100vh; background:#fdfdfd; box-shadow:0 0 10px #999; position:relative;}
.center {text-align:center;}
.button {background:#007aff; color:white; padding:0.6em 1.2em; margin:0.5em; display:inline-block; border-radius:8px; cursor:pointer; font-size:1em;}
#log {font-family:monospace; background:#000; color:#0f0; padding:10px; height:150px; overflow-y:scroll; margin:0.5em;}
.tab {padding:0.5em; display:inline-block; background:#ddd; margin:2px; cursor:pointer; border-radius:5px;}
.activeTab {background:#bbb; font-weight:bold;}
textarea {width:95%; max-width:100%; box-sizing:border-box; margin:0.5em 0;}
#appsList div {padding:5px; border:1px solid #ccc; margin:5px 0; cursor:pointer;}
img#appIcon {width:64px; height:64px; margin-bottom:10px;}
</style>
</head>
<body>
<div id="screen">

<!-- Welcome -->
<div id="welcome" class="center">
  <h1>Fydiot</h1>
  <p id="osCheck"></p>
  <div id="startBtn" class="button">Start Jailbreak</div>
</div>

<!-- Loader -->
<div id="loader" style="display:none;">
  <h2 class="center">Initializing...</h2>
  <div id="log"></div>
</div>

<!-- Fydiot App -->
<div id="fydiotApp" style="display:none; padding:10px;">
  <div class="center">
    <img id="appIcon" src="apple-touch-icon.png" alt="Fydiot Icon">
  </div>
  <h2 class="center">Fydiot Loader</h2>
  <div class="center">
    <span class="tab activeTab" onclick="switchTab('create')">Create App</span>
    <span class="tab" onclick="switchTab('discover')">Discover Apps</span>
  </div>
  <div id="create" style="margin-top:10px;">
    <h3>Block Coding Editor</h3>
    <textarea id="code" rows="10"></textarea>
    <div class="button" onclick="runApp()">Run App</div>
    <div class="button" onclick="publishApp()">Publish App</div>
  </div>
  <div id="discover" style="display:none; margin-top:10px;">
    <h3>Public Repository</h3>
    <div id="appsList"></div>
  </div>
</div>
</div>

<script>
// --- OS Detection ---
var ua = navigator.userAgent;
var isOldIOS = /iPhone|iPad|iPod/.test(ua) && /OS [3-6](_\d+)?/.test(ua);
var isOldAndroid = /Android [1-5]\./.test(ua);
var supported = isOldIOS || isOldAndroid || true;

document.getElementById('osCheck').innerText = supported ? 
  'Your device is supported. Click Start Jailbreak.' :
  'Sorry, this device is not supported. Please use iOS 3-6 or Android 1-5.';

// --- Fake Jailbreak ---
document.getElementById('startBtn').onclick = function(){
  if(!supported) return;
  document.getElementById('welcome').style.display='none';
  document.getElementById('loader').style.display='block';
  var log = document.getElementById('log');
  var steps = [
    "Scanning device...",
    "Bypassing security protocols...",
    "Injecting virtual payload...",
    "Overwriting system files...",
    "Optimizing kernel...",
    "Finalizing jailbreak..."
  ];
  var i=0;
  var interval = setInterval(function(){
    if(i<steps.length){
      log.innerHTML += steps[i]+"<br>";
      log.scrollTop = log.scrollHeight;
      i++;
    } else {
      clearInterval(interval);
      log.innerHTML += "<b>Jailbreak Complete! Save to Home Screen to load Fydiot.</b>";
    }
  },1500);
};

// --- Tab Switch ---
function switchTab(tab){
  document.getElementById('create').style.display='none';
  document.getElementById('discover').style.display='none';
  var tabs = document.getElementsByClassName('tab');
  for(var i=0;i<tabs.length;i++){tabs[i].className='tab';}
  var activeTab = document.querySelector(".tab[onclick='switchTab(\""+tab+"\")']");
  if(activeTab){activeTab.className='tab activeTab';}
  document.getElementById(tab).style.display='block';
}

// --- Repository ---
var publicApps = [
  {name:"Bounce Ball", code:"alert('Bouncing Ball!')"},
  {name:"Click Counter", code:"var c=0; setInterval(function(){c++; console.log(c);},1000)"}
];

function refreshApps(){
  var container = document.getElementById('appsList');
  container.innerHTML="";
  for(var i=0;i<publicApps.length;i++){
    var app = publicApps[i];
    var div = document.createElement('div');
    div.innerText = app.name;
    div.onclick = (function(code){return function(){eval(code);};})(app.code);
    container.appendChild(div);
  }
}
refreshApps();

// --- Run / Publish ---
function runApp(){
  var code = document.getElementById('code').value;
  try{eval(code); alert('App running!');} catch(e){alert('Error in app: '+e);}
}
function publishApp(){
  var name = prompt('App name?');
  if(!name) return;
  var code = document.getElementById('code').value;
  publicApps.push({name:name, code:code});
  refreshApps();
  alert('App published!');
}

// --- Detect Save to Home Screen ---
function isInStandaloneMode(){
  if(window.navigator.standalone!==undefined){return window.navigator.standalone;}
  if(window.matchMedia){return window.matchMedia('(display-mode: standalone)').matches;}
  return false;
}

if(isInStandaloneMode()){
  document.getElementById('loader').style.display='none';
  document.getElementById('welcome').style.display='none';
  document.getElementById('fydiotApp').style.display='block';
}
</script>
</body>
</html>
